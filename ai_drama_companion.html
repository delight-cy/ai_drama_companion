<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI追剧搭子 · 庆余年</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #1a1a24;
  --bg4: #22222f;
  --surface: #1e1e2a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --tencent: #00b5e5;
  --tencent2: #0095c2;
  --gold: #e6b84a;
  --gold2: #c99a2e;
  --text: #e8e8f0;
  --text2: #9898b0;
  --text3: #5a5a72;
  --red: #e05252;
  --green: #4caf7d;
  --radius: 10px;
  --font: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

body.is-fullscreen {
  overflow: hidden;
}

body.is-fullscreen .nav { display: none; }
body.is-fullscreen .video-column { flex: 1; min-height: 0; }
body.is-fullscreen .video-area { flex: 1; }

/* ── TOP NAV ── */
.nav {
  height: 52px;
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 100;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 700;
  color: var(--tencent);
  letter-spacing: -0.5px;
}

.nav-logo svg { width: 24px; height: 24px; }

.nav-title {
  flex: 1;
  font-size: 14px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-title span { color: var(--text); font-weight: 500; }
.nav-badge {
  background: var(--tencent);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.nav-actions { display: flex; align-items: center; gap: 10px; }
.nav-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font);
  transition: all .2s;
  display: flex; align-items: center; gap: 5px;
}
.nav-btn:hover { border-color: var(--tencent); color: var(--tencent); }
.nav-btn.vip { border-color: var(--gold); color: var(--gold); }
.nav-btn.vip:hover { background: rgba(230,184,74,0.1); }

/* ── MAIN ── */
.video-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
  min-width: 0;
  min-height: 0;
}

.video-area {
  flex: 1;
  position: relative;
  background: #000;
  overflow: hidden;
  cursor: pointer;
  min-height: 200px;
}

/* 真实视频在底层，3D 与气泡叠在上层 */
.main-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
  background: #000;
}

.video-overlay-ui {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* 2D 搭子贴图层：固定在视频区域左下角 */
#companion-layer {
  position: absolute;
  left: 0;
  bottom: 0;
  width: min(42%, 360px);
  height: min(58%, 460px);
  z-index: 12;
  pointer-events: none;
}
.companion-sprite {
  position: absolute;
  left: 10px;
  bottom: 6px;
  width: min(76%, 260px);
  max-height: 92%;
  object-fit: contain;
  transform-origin: 50% 100%;
  opacity: 0;
  transform: translateY(8px) scale(0.92);
  transition: opacity .35s ease, transform .35s ease;
  filter: drop-shadow(0 12px 30px rgba(0,0,0,.45));
}
.companion-sprite.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  animation: spritePop .45s ease-out;
}
@keyframes spritePop {
  0% { opacity: 0; transform: translateY(8px) scale(.86); }
  68% { opacity: 1; transform: translateY(-2px) scale(1.03); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* 追剧搭子：模型旁半透明气泡，说完后淡出 */
.girl-speech-bubble {
  position: absolute;
  left: 34px;
  bottom: calc(min(58%, 460px) - 26px);
  max-width: 268px;
  z-index: 14;
  opacity: 0;
  transform: translateY(6px) scale(0.98);
  transition: opacity 0.45s ease, transform 0.45s ease;
  pointer-events: none;
  overflow: visible;
}
.girl-speech-bubble.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.girl-speech-bubble.fading {
  opacity: 0;
  transform: translateY(-4px) scale(0.98);
  transition: opacity 0.55s ease, transform 0.55s ease;
}

.girl-speech-inner {
  position: relative;
  background: rgba(24, 28, 44, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.28);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 11px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.94);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}

/* 范闲：画布旁气泡（与追剧搭子同款逻辑，略偏金） */
.fan-speech-bubble {
  position: absolute;
  left: 34px;
  bottom: calc(min(58%, 460px) + 56px);
  max-width: 268px;
  z-index: 14;
  opacity: 0;
  transform: translateY(6px) scale(0.98);
  transition: opacity 0.45s ease, transform 0.45s ease;
  pointer-events: none;
  overflow: visible;
}
.fan-speech-bubble.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.fan-speech-bubble.fading {
  opacity: 0;
  transform: translateY(-4px) scale(0.98);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.fan-speech-inner {
  position: relative;
  background: rgba(40, 32, 18, 0.48);
  border: 1px solid rgba(230, 184, 74, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 11px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255, 248, 230, 0.95);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}

.api-key-row {
  display: flex;
  gap: 8px;
  padding: 0 12px 8px;
  align-items: center;
}
.api-key-input {
  flex: 1;
  min-width: 0;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 11px;
  font-family: var(--font);
  outline: none;
}
.api-key-input:focus { border-color: var(--tencent); }
.api-key-save {
  flex-shrink: 0;
  padding: 7px 12px;
  border: none;
  border-radius: 8px;
  background: var(--tencent);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--font);
}
.api-key-save:hover { background: var(--tencent2); }
.api-key-clear {
  flex-shrink: 0;
  padding: 7px 10px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--font);
}
.api-key-clear:hover { border-color: var(--text3); color: var(--text); }

.ep-info {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text2);
  backdrop-filter: blur(8px);
}
.ep-info strong { color: var(--text); }

.scene-label {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(230,184,74,0.4);
  color: var(--gold);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 5px;
  backdrop-filter: blur(8px);
  animation: sceneFade 3s ease-in-out infinite;
}

.drama-title-overlay {
  position: absolute;
  bottom: 72px;
  left: 20px;
  right: 20px;
  pointer-events: none;
}
.drama-title-overlay .chi { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 4px; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }
.drama-title-overlay .sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; letter-spacing: 1px; }

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .3s;
  background: rgba(0,0,0,0.35);
  z-index: 18;
  pointer-events: none;
}
.play-overlay .play-btn-big { pointer-events: auto; cursor: pointer; }
.video-area:hover .play-overlay,
.video-area.show-play-hint .play-overlay { opacity: 1; }
.play-btn-big {
  width: 64px;
  height: 64px;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  transition: all .2s;
}
.play-btn-big:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }

/* ── VIDEO CONTROLS ── */
.video-controls {
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 100%);
  padding: 10px 16px 14px;
  flex-shrink: 0;
  z-index: 20;
}

.progress-container {
  position: relative;
  height: 3px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 10px;
}
.progress-bar {
  height: 100%;
  background: var(--tencent);
  border-radius: 2px;
  width: 23%;
  position: relative;
  transition: height .2s;
}
.progress-container:hover { height: 5px; margin-top: -1px; }
.progress-dot {
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 11px;
  height: 11px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--tencent);
  display: none;
}
.progress-container:hover .progress-dot { display: block; }

.story-marker {
  position: absolute;
  top: -3px;
  width: 2px;
  height: 9px;
  background: var(--gold);
  border-radius: 1px;
  transform: translateX(-50%);
  cursor: pointer;
}
.story-marker::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--gold);
  color: var(--gold);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.story-marker:hover::after { opacity: 1; }

.ctrl-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.ctrl-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .2s, background .2s;
  font-size: 12px;
  font-family: var(--font);
}
.ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
.ctrl-btn svg { width: 18px; height: 18px; }

.time-display { font-size: 12px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
.ctrl-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.vol-slider {
  width: 70px;
  height: 3px;
  accent-color: var(--tencent);
  cursor: pointer;
}

.quality-tag {
  font-size: 11px;
  padding: 2px 7px;
  background: rgba(0,181,229,0.15);
  border: 1px solid rgba(0,181,229,0.3);
  color: var(--tencent);
  border-radius: 3px;
}

/* ── 右侧边栏：对话记录（与设定同面板） ── */
.edge-panel-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.edge-panel-settings {
  flex: 0 1 48%;
  min-height: 0;
  overflow-y: auto;
}
.edge-panel-settings::-webkit-scrollbar { width: 4px; }
.edge-panel-settings::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.edge-chat-dock {
  flex: 1;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--border2);
  padding: 8px 0 10px;
  background: rgba(0,0,0,0.22);
}
.edge-chat-head {
  padding: 0 14px 6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.edge-chat-title { font-size: 13px; font-weight: 600; color: var(--text); }
.edge-chat-meta { font-size: 10px; color: var(--text3); text-align: right; }

.sidebar-messages {
  flex: 1;
  min-height: 64px;
  overflow-y: auto;
  padding: 4px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-messages::-webkit-scrollbar { width: 4px; }
.sidebar-messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
.sidebar-messages .bubble { max-width: 100%; }

.sidebar-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 0 10px 6px;
  max-height: 76px;
  overflow-y: auto;
}
.sidebar-input-row {
  display: flex;
  gap: 8px;
  padding: 0 12px;
  align-items: flex-end;
}
.sidebar-msg-input { min-height: 38px; max-height: 80px; }

.mode-pill {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(0,181,229,0.15);
  border: 1px solid rgba(0,181,229,0.35);
  color: var(--tencent);
}

.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  margin-bottom: 2px;
}
.msg.ai .msg-avatar { background: linear-gradient(135deg, #0f2a45, #1a3d5c); border: 1px solid var(--tencent); }
.msg.user .msg-avatar { background: var(--bg4); border: 1px solid var(--border2); font-size: 10px; color: var(--text2); }

.bubble {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  word-break: break-word;
}

.msg.ai .bubble {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

.msg.user .bubble {
  background: linear-gradient(135deg, var(--tencent2), #005f7a);
  border-bottom-right-radius: 4px;
  color: #fff;
}

.bubble-name {
  font-size: 10px;
  color: var(--tencent);
  margin-bottom: 4px;
  font-weight: 500;
}

.sys-msg {
  text-align: center;
  font-size: 11px;
  color: var(--text3);
  padding: 4px 10px;
  background: var(--bg3);
  border-radius: 16px;
  margin: 2px auto;
  width: fit-content;
  border: 1px solid var(--border);
}

.quick-prompts {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.quick-prompts::-webkit-scrollbar { height: 0; }

.qp-btn {
  flex-shrink: 0;
  padding: 4px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font);
  transition: all .2s;
  white-space: nowrap;
}
.qp-btn:hover { border-color: var(--tencent); color: var(--tencent); }

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.msg-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 11px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  resize: none;
  max-height: 88px;
  line-height: 1.45;
  transition: border-color .2s;
}
.msg-input:focus { border-color: rgba(0,181,229,0.4); }
.msg-input::placeholder { color: var(--text3); }

.send-btn {
  width: 38px;
  height: 38px;
  background: var(--tencent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--tencent2); }
.send-btn:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; }

/* ── EDGE SETTINGS PANEL ── */
.edge-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 320px;
  max-width: 92vw;
  height: 100%;
  z-index: 2000;
  background: rgba(18,18,28,0.72);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border-left: 1px solid var(--border2);
  box-shadow: -12px 0 40px rgba(0,0,0,0.45);
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
  pointer-events: auto;
}
.edge-panel.open {
  transform: translateX(0);
}

.edge-panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.edge-panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.edge-close {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text2);
  width: 30px;
  height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  transition: all .2s;
}
.edge-close:hover { border-color: var(--tencent); color: var(--tencent); }

.mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px 14px 10px;
}
.mode-tab {
  padding: 10px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  font-size: 12px;
  font-family: var(--font);
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  font-weight: 500;
}
.mode-tab:hover { border-color: var(--border2); color: var(--text); }
.mode-tab.active {
  border-color: var(--tencent);
  color: var(--tencent);
  background: rgba(0,181,229,0.12);
}

.edge-panel-settings .panel-body {
  padding: 0 14px 12px;
}

.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 6px;
}
.form-select, .form-range-wrap {
  width: 100%;
}
.form-select select {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
}
.form-select select:focus { border-color: var(--tencent); }

input[type="range"].setting-range {
  width: 100%;
  accent-color: var(--tencent);
}
.range-hint {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text3);
  margin-top: 4px;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.toggle-row span { font-size: 13px; color: var(--text2); }

.switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider-sw {
  position: absolute;
  cursor: pointer;
  inset: 0;

}

function pickGirlApiParams() {
  const freq = girlSettings.dialogueFreq;
  if (freq <= 33) return { max_tokens: 520, temperature: 0.98, presence_penalty: 0.45 };
  if (freq >= 67) return { max_tokens: 180, temperature: 0.62, presence_penalty: -0.1 };
  return { max_tokens: 320, temperature: 0.82, presence_penalty: 0.1 };
}

function forceGirlStyleByPostprocess(reply) {
  const lines = reply.split('\n').map((x) => x.trim()).filter(Boolean);
  const bodyNoTag = lines.filter((x) => !/^【性格=/.test(x)).join(' ');
  const sentenceParts = bodyNoTag.split(/(?<=[。！？!?])/).map((s) => s.trim()).filter(Boolean);
  const freq = girlSettings.dialogueFreq;
  if (freq >= 67) {
    return sentenceParts.slice(0, 2).join(' ') || bodyNoTag;
  }
  if (freq <= 33) {
    if (sentenceParts.length >= 3) return bodyNoTag;
    return `${bodyNoTag} 我再补一个细节：这段其实还有伏笔。你如果愿意，我还能继续展开讲。`;
  }
  return sentenceParts.slice(0, 2).join(' ') || bodyNoTag;
}

let apiChatHistory = [];

async function callDeepSeekAPI(userMessage, systemPrompt, options = {}) {
  const key = getStoredApiKey().trim();
  if (!key.startsWith('sk-')) throw new Error('API Key 需以 sk- 开头');
  const messages = [{ role: 'system', content: systemPrompt }, ...apiChatHistory.slice(-12), { role: 'user', content: userMessage }];
  // #region agent log
  fetch('http://127.0.0.1:7882/ingest/d1e03375-a796-4d6e-acd4-99f26d66975c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'7a7c69'},body:JSON.stringify({sessionId:'7a7c69',location:'ai_drama_companion.html:callDeepSeekAPI',message:'api_request_ready',data:{messagesCount:messages.length,systemLen:systemPrompt.length,systemHead:systemPrompt.slice(0,90)},timestamp:Date.now(),hypothesisId:'H2',runId:'settings-debug-v1'})}).catch(()=>{});
  // #endregion
  const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${key}`
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages,
      max_tokens: options.max_tokens ?? 400,
      temperature: options.temperature ?? 0.85,
      presence_penalty: options.presence_penalty ?? 0,
      stream: false
    })
  });
  const raw = await res.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error(`DeepSeek 返回非 JSON：${raw.slice(0, 120)}`);
  }
  if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
  const reply = data.choices?.[0]?.message?.content?.trim();
  if (!reply) throw new Error('空回复');
  // #region agent log
  fetch('http://127.0.0.1:7882/ingest/d1e03375-a796-4d6e-acd4-99f26d66975c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'7a7c69'},body:JSON.stringify({sessionId:'7a7c69',location:'ai_drama_companion.html:callDeepSeekAPI',message:'api_reply_received',data:{replyLen:reply.length,replyHead:reply.slice(0,60)},timestamp:Date.now(),hypothesisId:'H4',runId:'settings-debug-v1'})}).catch(()=>{});
  // #endregion
  return reply;
}

function formatTime(sec) {
  if (!Number.isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateVideoTimeUi() {
  const cur = mainVideo.currentTime;
  const dur = mainVideo.duration;
  const d = Number.isFinite(dur) && dur > 0 ? dur : 0;
  timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(d)}`;
  if (d > 0) {
    const pct = (cur / d) * 100;
    document.getElementById('progressFill').style.width = `${pct}%`;
  }
}

function getEffectiveChatMode() {
  if (activePanelMode === 'girl' && girlEnabled) return 'girl';
  if (activePanelMode === 'fanxian' && fanxianEnabled) return 'fanxian';
  return 'companion_locked';
}

async function sendChat() {
  const text = msgInput.value.trim();
  if (!text || sendBtn.disabled) return;

  const mode = getEffectiveChatMode();
  if (mode === 'companion_locked') {
    appendSidebarSys(activePanelMode === 'girl' ? '请先点击「启用追剧搭子」，再开始对话。' : '请先点击「启用范闲」，再开始对话。');
    return;
  }

  appendSidebarUser(text);
  msgInput.value = '';
  msgInput.style.height = 'auto';

  const name = mode === 'girl' ? '追剧搭子' : '范闲';
  const useApi = getStoredApiKey().trim().startsWith('sk-');
  sendBtn.disabled = true;
  let reply = '';
  try {
    if (useApi) {
      const sys = mode === 'girl' ? buildGirlSystemPrompt() : FANXIAN_SYSTEM;
      const apiOpts = mode === 'girl' ? pickGirlApiParams() : {};
      // #region agent log
      fetch('http://127.0.0.1:7882/ingest/d1e03375-a796-4d6e-acd4-99f26d66975c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'7a7c69'},body:JSON.stringify({sessionId:'7a7c69',location:'ai_drama_companion.html:sendChat',message:'send_with_mode_settings',data:{mode,personality:girlSettings.personality,stance:girlSettings.stance,dialogueFreq:girlSettings.dialogueFreq,apiOpts,sysHead:sys.slice(0,130)},timestamp:Date.now(),hypothesisId:'H3',runId:'settings-debug-v2'})}).catch(()=>{});
      // #endregion
      try {
        reply = await callDeepSeekAPI(text, sys, apiOpts);
        if (mode === 'girl') {
          const before = reply;
          reply = forceGirlStyleByPostprocess(reply);
          // #region agent log
          fetch('http://127.0.0.1:7882/ingest/d1e03375-a796-4d6e-acd4-99f26d66975c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'7a7c69'},body:JSON.stringify({sessionId:'7a7c69',location:'ai_drama_companion.html:sendChat',message:'girl_postprocess_applied',data:{beforeLen:before.length,afterLen:reply.length,freq:girlSettings.dialogueFreq,afterHead:reply.slice(0,80)},timestamp:Date.now(),hypothesisId:'H4',runId:'settings-debug-v2'})}).catch(()=>{});
          // #endregion
        }
        apiChatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
      } catch (apiErr) {
        reply = mode === 'girl' ? girlReply(text) : fanxianReply(text);
        appendSidebarSys(`DeepSeek 不可用，已用本地预设：${apiErr.message || apiErr}`);
      }
    } else {
      reply = mode === 'girl' ? girlReply(text) : fanxianReply(text);
    }
    appendSidebarAi(name, reply);
    if (mode === 'girl') showGirlSpeechBubble(reply);
    else showFanxianSpeechBubble(reply);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => {
  sendChat();
});
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});
msgInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 88) + 'px';
});

/* ── 初始化 ── */
logGirlSettings();
document.getElementById('girlPersonality').value = girlSettings.personality;
const savedKey = getStoredApiKey();
if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
refreshDialogChrome();
appendSidebarSys('鼠标移到屏幕最右侧边缘可拉出设定与对话面板。');
appendSidebarSys('在「对话」上方输入 DeepSeek 密钥并保存后，回复由 API 生成（否则用本地预设）。');
updateCompanionButtons();
syncCompanionVisibility();

// #region agent log
fetch('http://127.0.0.1:7882/ingest/d1e03375-a796-4d6e-acd4-99f26d66975c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'7a7c69'},body:JSON.stringify({sessionId:'7a7c69',location:'ai_drama_companion.html:init',message:'init_complete_2d',data:{ok:true,activePanelMode,girlEnabled,fanxianEnabled},timestamp:Date.now(),hypothesisId:'H6',runId:'2d-fix'})}).catch(()=>{});
// #endregion
</script>
